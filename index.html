<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name=""viewport" content="width=device-width, initial-scale=1.0">
        <title>Monthly expense tracker</title>
        <!-- Google font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
        <!-- Stylesheet -->
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <div class="container">
                <h1>Monthly Expense Tracker</h1>
                <form method="POST">
                    <div class="field-wrapper">
                        <fieldset>
                            <label for="month">Month</label>
                            <select id="month" name="month" class="input-bar">
                                <option value="">-</option>
                                <option value="January">January</option>
                                <option value="February">February</option>
                                <option value="March">March</option>
                                <option value="April">April</option>
                                <option value="May">May</option>
                                <option value="June">June</option>
                                <option value="July">July</option>
                                <option value="August">August</option>
                                <option value="September">September</option>
                                <option value="October">October</option>
                                <option value="November">November</option>
                                <option value="December">December</option>
                            </select>
                        </fieldset>
                        <fieldset>
                            <label for="year">Year</label>
                            <select id="year" name="year" class="input-bar">
                                <!-- Dynamically generate with js -->
                                <option value="">-</option> 
                            </select>
                        </fieldset>
                        <fieldset>
                            <label for="category">Category</label>
                            <select id="category" name="category" class="input-bar">
                                <option value="">-</option> 
                                <option value="Housing">Housing</option>
                                <option value="Food">Food</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Bills">Bills</option>
                                <option value="Miscellaneous">Miscellaneous</option>
                            </select>
                        </fieldset>
                        
                        <fieldset>
                            <label for="amount">Amount</label>
                            <input type=""number id="amount" name="amount" class="input-bar" placeholder="Enter amount" required>
                        </fieldset>
                    </div>
        
                    <button id="addExpense">Add expense</button>
                </form>
                <section>
                    <canvas id="expense-chart"></canvas>
                </section>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
